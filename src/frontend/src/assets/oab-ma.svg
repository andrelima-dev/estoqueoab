<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 150" role="img" aria-label="OAB Maranhão">
  <title>OAB Maranhão</title>
  <!--
    Aplicação simplificada da marca OAB, permitida pelo Manual de Identidade
    Visual (pág. 9): "É permitido, com o objetivo de manter uma linguagem leve
    e moderna nas peças de comunicação, utilizar a marca na forma simplificada".

    Fundo no vermelho Pantone 200 C, letras em branco.

    Este é um redesenho vetorial da forma simplificada. Para rigor absoluto de
